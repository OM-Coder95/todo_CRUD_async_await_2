                                <label for="todoName">Enter your Todo:</label>
                                <input id="todoName" type="text" class="form-control" required>
                            </div>

                            <div class="form-group">
                                <label for="todoDescription">Descritpion</label>
                                <textarea id="todoDescription" class="form-control"></textarea>
                            </div>

                            <div class="form-group">
                                <label for="isCompleted">Is Completed:</label>
                                <select id="isCompleted" class="form-control">
                                    <option value="yes">Yes</option>
                                    <option value="no">No</option>
                                </select>
                            </div>

                            <button id="addTodoBtn" type="submit" class="btn btn-sm btn-block btn-primary">Add
                                Todo</button>
                            <button id="updateTodoBtn" type="button"
                                class="btn btn-sm btn-block btn-success d-none">Update Todo</button>
                        </form>
                    </div>
                </div>
